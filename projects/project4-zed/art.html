<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Sticky Notes</title>
    <link rel="stylesheet" href="css/art-styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Virtual sticky notes</h1>
            <p>Draw with your mouse or trackpad</p>
        </header>

        <div class="toolbar">
            <div class="tool-group">
                <label>Tool:</label>
                <button class="tool-btn active" data-tool="brush">
                    <span>🖌️</span> Pencil
                </button>
                <button class="tool-btn" data-tool="eraser">
                    <span>🧹</span> Eraser
                </button>
                <button class="tool-btn" data-tool="spray">
                    <span>💨</span> Spray Can
                </button>
                <button class="tool-btn" data-tool="text">
                    <span>✍️</span> Text
                </button>
            </div>

            <div class="tool-group">
                <label>Size:</label>
                <input type="range" id="brush-size" min="1" max="50" value="5">
                <span id="size-display">5px</span>
            </div>

            <div class="tool-group" id="font-size-group" style="display: none;">
                <label>Font Size:</label>
                <input type="range" id="font-size" min="10" max="100" value="20">
                <span id="font-size-display">20px</span>
            </div>

            <div class="tool-group">
                <label>Color:</label>
                <input type="color" id="color-picker" value="#000000">
                <div class="color-presets">
                    <button class="color-preset" data-color="#000000" style="background: #000000;"></button>
                    <button class="color-preset" data-color="#FF0000" style="background: #FF0000;"></button>
                    <button class="color-preset" data-color="#00FF00" style="background: #00FF00;"></button>
                    <button class="color-preset" data-color="#0000FF" style="background: #0000FF;"></button>
                    <button class="color-preset" data-color="#FFFF00" style="background: #FFFF00;"></button>
                    <button class="color-preset" data-color="#FF00FF" style="background: #FF00FF;"></button>
                    <button class="color-preset" data-color="#00FFFF" style="background: #00FFFF;"></button>
                    <button class="color-preset" data-color="#FFFFFF" style="background: #FFFFFF; border: 1px solid #ccc;"></button>
                </div>
            </div>

            <div class="tool-group">
                <button id="clear-btn" class="action-btn">
                    <span>🗑️</span> Clear Canvas
                </button>
                <button id="save-btn" class="action-btn">
                    <span>💾</span> Save Image
                </button>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="art-canvas"></canvas>
        </div>

        <!-- Sticky Note Gallery Section -->
        <section class="gallery-section">
            <div class="gallery-header">
                <h2>📌 Sticky Note Gallery</h2>
                <div class="gallery-controls">
                    <button id="save-to-gallery-btn" class="gallery-action-btn">
                        <span>💾</span> Save Current Note
                    </button>
                    <button id="clear-gallery-btn" class="gallery-action-btn danger">
                        <span>🗑️</span> Clear Gallery
                    </button>
                </div>
            </div>
            <div id="gallery-container" class="gallery-grid">
                <p class="empty-message">No sticky notes saved yet. Create and save your first note!</p>
            </div>
        </section>

        <footer>
            <p>Click and drag to draw • Use toolbar to change tools and colors • Select Text tool and click to type</p>
        </footer>
    </div>

    <!-- Text input modal -->
    <div id="text-modal" class="text-modal">
        <div class="text-modal-content">
            <h3>Enter Your Text</h3>
            <textarea id="text-input" placeholder="Type your text here..." rows="3"></textarea>
            <div class="text-modal-buttons">
                <button id="text-confirm">Add Text</button>
                <button id="text-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/art.js"></script>
</body>
</html>
